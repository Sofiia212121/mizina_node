<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div id="messages">

    </div>
    <form action="#" id="sendMessageForm">
        <input type="text" id="userName" placeholder="Enter your name" />
        <textarea
            name="messageText"
            id="messageText"
            cols="30"
            rows="5"
            placeholder="Type your message here..."
        >
        </textarea>
        <button type="submit" id="messageSubmit">SEND</button>
    </form>

    <script src="front.js"></script>
</div>
</body>
</html>
