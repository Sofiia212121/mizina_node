<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
  </head>
  <body class="light-blue lighten-5">
    <div id="app" class="row card-panel light-blue lighten-4">
      <div
        id="messages"
        class="col s12 card-panel light-blue lighten-3"
        style="height: 300px; overflow-y: auto; padding: 10px"
      ></div>
      <form id="sendMessageForm" class="col s12">
        <div class="col s12 input-field">
          <input type="text" id="userName" class="validate" required />
          <label for="userName">Your Name</label>
        </div>

        <div class="col s12 input-field">
          <textarea
            id="messageText"
            class="materialize-textarea"
            required
          ></textarea>
          <label for="messageText">Your Message</label>
        </div>

        <div class="col s12">
          <button
            type="submit"
            id="messageSubmit"
            class="btn waves-effect waves-light blue darken-3 col s12"
          >
            SEND
          </button>
        </div>
      </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="front.js"></script>
  </body>
</html>
